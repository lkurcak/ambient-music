<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Still Water</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Literata:ital,opsz,wght@1,7..72,300;1,7..72,400&display=swap">
<style>
/* Layout: a lake at dusk fills the screen; the player sits low on the left like a caption on the water. */
:root {
  --bg: #e6ecee;
  --fg: #1c2a30;
  --muted: #5d6f77;
  --accent: #2c6a72;
  --on-accent: #f3f7f7;
  --water: #7d9aa3;
  --glow: #c98a3e;
  --track: #c7d3d7;
  --font-display: "Literata", "Iowan Old Style", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171b; --fg: #dde6e5; --muted: #8a9ca0; --accent: #9ccac3;
    --on-accent: #0e171b; --water: #4f6f77; --glow: #e0a861; --track: #2a3a40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171b; --fg: #dde6e5; --muted: #8a9ca0; --accent: #9ccac3;
  --on-accent: #0e171b; --water: #4f6f77; --glow: #e0a861; --track: #2a3a40;
  color-scheme: dark;
}

/* Each style tints the scene. Light values first, then the same two dark selectors as above. */
:root[data-style="lofi"] { --bg: #ebe5ee; --fg: #2a1f2e; --muted: #6d5f72; --accent: #74497a; --on-accent: #f7f2f8; --water: #ae94b4; --glow: #d0805a; --track: #d6cadb; }
:root[data-style="midnight"] { --bg: #e2e5ef; --fg: #1b2036; --muted: #5d6480; --accent: #3a4683; --on-accent: #f2f4fb; --water: #8c96bc; --glow: #5d74c4; --track: #c9cee2; }
:root[data-style="lab"] { --bg: #eaedef; --fg: #1a2229; --muted: #5b6873; --accent: #1d6bb3; --on-accent: #f3f7fb; --water: #9db0c1; --glow: #e07a22; --track: #cbd4dc; }
:root[data-style="scarlet"] { --bg: #f0e4e4; --fg: #2e1418; --muted: #74545a; --accent: #9c2638; --on-accent: #fbf2f3; --water: #c29aa0; --glow: #b8892e; --track: #e0cbcd; }
:root[data-style="void"] { --bg: #e8e8e6; --fg: #1d1d1d; --muted: #5f5f5c; --accent: #3d3d3a; --on-accent: #f5f5f3; --water: #a3a39f; --glow: #6a6a66; --track: #d0d0cc; }
@media (prefers-color-scheme: dark) {
  :root[data-style="lofi"]:not([data-theme="light"]) { --bg: #19131e; --fg: #ece2ee; --muted: #a090a6; --accent: #d6afdc; --on-accent: #19131e; --water: #5d4867; --glow: #e89e78; --track: #3a2e40; }
  :root[data-style="midnight"]:not([data-theme="light"]) { --bg: #0a0d19; --fg: #dfe3f4; --muted: #8c93b3; --accent: #a9b5e8; --on-accent: #0a0d19; --water: #37406a; --glow: #cdd6ff; --track: #262c48; }
  :root[data-style="lab"]:not([data-theme="light"]) { --bg: #0f1215; --fg: #e1e8ee; --muted: #8b98a3; --accent: #6db2ef; --on-accent: #0f1215; --water: #3b4a57; --glow: #f29a45; --track: #2a343d; }
  :root[data-style="scarlet"]:not([data-theme="light"]) { --bg: #160a0d; --fg: #f1e2e4; --muted: #a8868b; --accent: #e88593; --on-accent: #160a0d; --water: #5e2a33; --glow: #e3b55c; --track: #3a1d23; }
  :root[data-style="void"]:not([data-theme="light"]) { --bg: #08080a; --fg: #e4e4e6; --muted: #8a8a90; --accent: #d8d8de; --on-accent: #08080a; --water: #34343a; --glow: #f2f2f6; --track: #222226; }
}
:root[data-theme="dark"][data-style="lofi"] { --bg: #19131e; --fg: #ece2ee; --muted: #a090a6; --accent: #d6afdc; --on-accent: #19131e; --water: #5d4867; --glow: #e89e78; --track: #3a2e40; }
:root[data-theme="dark"][data-style="midnight"] { --bg: #0a0d19; --fg: #dfe3f4; --muted: #8c93b3; --accent: #a9b5e8; --on-accent: #0a0d19; --water: #37406a; --glow: #cdd6ff; --track: #262c48; }
:root[data-theme="dark"][data-style="lab"] { --bg: #0f1215; --fg: #e1e8ee; --muted: #8b98a3; --accent: #6db2ef; --on-accent: #0f1215; --water: #3b4a57; --glow: #f29a45; --track: #2a343d; }
:root[data-theme="dark"][data-style="scarlet"] { --bg: #160a0d; --fg: #f1e2e4; --muted: #a8868b; --accent: #e88593; --on-accent: #160a0d; --water: #5e2a33; --glow: #e3b55c; --track: #3a1d23; }
:root[data-theme="dark"][data-style="void"] { --bg: #08080a; --fg: #e4e4e6; --muted: #8a8a90; --accent: #d8d8de; --on-accent: #08080a; --water: #34343a; --glow: #f2f2f6; --track: #222226; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  transition: background-color 1.2s ease;
  color: var(--fg);
  font: 400 15px/1.5 var(--font-body);
  overflow: hidden;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.player {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 24px;
  padding-block: 28px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 760px;
}
@media (min-width: 700px) { .player { padding-left: max(56px, env(safe-area-inset-left, 0px)); padding-block: 40px 48px; } }

header { display: flex; flex-direction: column; gap: 14px; }
.title { display: flex; flex-direction: column; gap: 2px; }
.styles { display: flex; flex-wrap: wrap; gap: 8px; }
.styles button { padding: 8px 16px; font-size: 14px; border-color: var(--track); color: var(--muted); }
.styles button[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.name { font: 500 13px/1.2 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; }
.tagline { color: var(--muted); font-size: 14px; }

.now { display: flex; flex-direction: column; gap: 18px; }
.chord {
  font: italic 300 clamp(64px, 16vw, 150px)/1.12 var(--font-display);
  letter-spacing: -0.02em;
  margin: 0;
  min-height: 1em;
  text-wrap: balance;
  transition: opacity 1.6s ease;
}
.chord.fading { opacity: 0.15; }
.meta {
  display: flex; flex-wrap: wrap; gap: 6px 18px;
  font: 400 13px/1.4 var(--font-mono);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.meta b { color: var(--fg); font-weight: 500; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
button {
  font: 500 15px/1 var(--font-body);
  border-radius: 999px;
  padding: 13px 22px;
  cursor: pointer;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--fg);
}
button.primary { background: var(--accent); color: var(--on-accent); min-width: 128px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
button:disabled { opacity: 0.5; cursor: progress; }
.volume { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
input[type="range"] { width: 120px; accent-color: var(--accent); }

.history {
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-wrap: wrap; gap: 4px 16px;
  font: 400 12px/1.5 var(--font-mono);
  color: var(--muted);
  min-height: 1.5em;
}
.history li:first-child { color: var(--fg); }
.status { color: var(--glow); font-size: 14px; min-height: 1.4em; margin: 0; }
.hint { color: var(--muted); font-size: 12px; }
kbd { font: 500 11px var(--font-mono); border: 1px solid var(--track); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<canvas id="water" aria-hidden="true"></canvas>
<main class="player">
  <header>
    <div class="title">
      <span class="name">Still Water</span>
      <span class="tagline" id="tagline">Endless generative music for long, quiet thinking</span>
    </div>
    <div class="styles" id="styles" role="group" aria-label="Style">
      <button type="button" data-style="meadow">Meadow</button>
      <button type="button" data-style="lofi">Lo-fi</button>
      <button type="button" data-style="midnight">Midnight</button>
      <button type="button" data-style="lab">Lab</button>
      <button type="button" data-style="scarlet">Scarlet</button>
      <button type="button" data-style="void">Void</button>
    </div>
  </header>

  <section class="now" aria-live="polite">
    <p class="chord" id="chord">Press play</p>
    <div class="meta">
      <span>key <b id="key">–</b></span>
      <span>mood <b id="section">–</b></span>
      <span>with <b id="voices">–</b></span>
      <span><b id="bpm">66</b> bpm</span>
      <span id="clock">0:00</span>
      <span>piece <b id="seed">–</b></span>
    </div>
    <ul class="history" id="history" aria-label="Recent chords"></ul>
  </section>

  <div class="now">
    <div class="controls">
      <button class="primary" id="play" type="button">Play</button>
      <button id="next" type="button">New piece</button>
      <label class="volume" for="volume">Volume
        <input id="volume" type="range" min="0" max="100" value="70">
      </label>
    </div>
    <p class="status" id="status" role="status"></p>
    <span class="hint"><kbd>Space</kbd> play or pause · <kbd>N</kbd> new piece · <kbd>1</kbd>–<kbd>6</kbd> style · same piece number, same music</span>
  </div>
</main>

<script>
(() => {
  // Same order as Style::ALL in the engine.
  const STYLES = [
    { id: "meadow", bpm: 66, tagline: "Lush major chords, a sparse piano and celesta, wide open air" },
    { id: "lofi", bpm: 78, tagline: "Dusty Rhodes loops, soft swung drums and vinyl crackle" },
    { id: "midnight", bpm: 56, tagline: "Minor-key piano over deep pads, with rain on the window" },
    { id: "lab", bpm: 96, tagline: "Pulsing synth sequences in an empty test chamber" },
    { id: "scarlet", bpm: 84, tagline: "Touhou at half speed: harmonic-minor piano and long themes that keep coming back" },
    { id: "void", bpm: 70, tagline: "Sparse chip melodies over drones, through a crushed old converter" },
  ];
  const $ = (id) => document.getElementById(id);
  const ui = {
    chord: $("chord"), key: $("key"), section: $("section"), voices: $("voices"), clock: $("clock"),
    seed: $("seed"), history: $("history"), play: $("play"), next: $("next"),
    volume: $("volume"), status: $("status"), tagline: $("tagline"), bpm: $("bpm"),
    styles: [...document.querySelectorAll("#styles button")],
  };

  const audio = { ctx: null, node: null, gain: null, analyser: null, module: null };
  // Links look like #lofi-4242; a bare #4242 means Meadow.
  const link = location.hash.match(/^#(?:([a-z]+)-)?(\d{1,9})$/) || [];
  let seed = Number(link[2]) || randomSeed();
  let style = Math.max(0, STYLES.findIndex((entry) => entry.id === link[1]));
  if (!link[2]) {
    try { style = Math.max(0, STYLES.findIndex((entry) => entry.id === localStorage.getItem("still-water-style"))); } catch {}
  }
  let playing = false;
  let level = 0;
  const recent = [];

  function randomSeed() { return 1 + Math.floor(Math.random() * 999999); }

  function showSeed() {
    ui.seed.textContent = seed;
    try { history.replaceState(null, "", `#${STYLES[style].id}-${seed}`); } catch {}
  }

  function showStyle() {
    const entry = STYLES[style];
    document.documentElement.dataset.style = entry.id;
    ui.tagline.textContent = entry.tagline;
    ui.bpm.textContent = entry.bpm;
    for (const button of ui.styles) button.setAttribute("aria-pressed", String(button.dataset.style === entry.id));
    try { localStorage.setItem("still-water-style", entry.id); } catch {}
    showSeed();
  }
  showStyle();

  try {
    const saved = localStorage.getItem("still-water-volume");
    if (saved !== null) ui.volume.value = saved;
  } catch {}

  function volumeGain() { const v = ui.volume.value / 100; return v * v; }

  async function setUpAudio() {
    if (!window.AudioWorkletNode) throw new Error("This browser can't run audio worklets. Try a recent Chrome, Firefox or Safari.");
    const ctx = new AudioContext({ latencyHint: "playback" });
    const [module] = await Promise.all([
      fetch("ambient.wasm").then((response) => {
        if (!response.ok) throw new Error(`Couldn't load the music engine (HTTP ${response.status}).`);
        return response.arrayBuffer();
      }).then((bytes) => WebAssembly.compile(bytes)),
      ctx.audioWorklet.addModule("worklet.js"),
    ]);
    const node = new AudioWorkletNode(ctx, "ambient", { numberOfInputs: 0, outputChannelCount: [2] });
    const gain = ctx.createGain();
    gain.gain.value = volumeGain();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    node.connect(gain).connect(analyser).connect(ctx.destination);
    node.port.onmessage = ({ data }) => onReport(data);
    Object.assign(audio, { ctx, node, gain, analyser, module });
  }

  function startPiece() {
    recent.length = 0;
    ui.history.replaceChildren();
    audio.node.port.postMessage({ type: "start", module: audio.module, seed, style, bpm: 0 });
    audio.gain.gain.cancelScheduledValues(audio.ctx.currentTime);
    audio.gain.gain.setTargetAtTime(volumeGain(), audio.ctx.currentTime, 0.05);
  }

  const decoder = new TextDecoder();
  function onReport({ elapsed, headlines }) {
    const minutes = Math.floor(elapsed / 60);
    const seconds = String(Math.floor(elapsed % 60)).padStart(2, "0");
    ui.clock.textContent = `${minutes}:${seconds}`;
    if (!headlines) return;
    for (const line of decoder.decode(headlines).split("\n")) {
      const parts = line.split(" · ");
      const chord = parts.pop();
      // Themes coming back and solo moments are worth a note in the history.
      let moment = "";
      for (const part of parts) {
        const key = part.match(/key of (.+)$/);
        if (key) ui.key.textContent = key[1];
        else if (part.startsWith("with ")) ui.voices.textContent = part.slice(5);
        else if (/^theme |alone$|^a breath$/.test(part)) moment = part;
        else ui.section.textContent = part;
      }
      showChord(chord, `${minutes}:${seconds}`, moment);
    }
  }

  function showChord(chord, time, moment) {
    ui.chord.classList.add("fading");
    setTimeout(() => {
      ui.chord.textContent = chord;
      ui.chord.classList.remove("fading");
    }, 700);
    recent.unshift(moment ? `${time} ${chord} · ${moment}` : `${time} ${chord}`);
    recent.length = Math.min(recent.length, 6);
    ui.history.replaceChildren(...recent.map((text) => {
      const item = document.createElement("li");
      item.textContent = text;
      return item;
    }));
    ripple();
  }

  async function togglePlay() {
    ui.status.textContent = "";
    try {
      if (!audio.ctx) {
        ui.play.disabled = true;
        ui.play.textContent = "Loading…";
        await setUpAudio();
        startPiece();
      }
      if (playing) await audio.ctx.suspend();
      else await audio.ctx.resume();
      playing = audio.ctx.state === "running";
    } catch (error) {
      ui.status.textContent = error.message || String(error);
      playing = false;
    } finally {
      ui.play.disabled = false;
      ui.play.textContent = playing ? "Pause" : "Play";
    }
  }

  // Fade the current piece out, then start whatever seed and style are set.
  let restart = null;
  function restartPiece() {
    ui.key.textContent = ui.section.textContent = ui.voices.textContent = "–";
    if (!audio.ctx) return togglePlay();
    audio.gain.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.25);
    clearTimeout(restart);
    restart = setTimeout(startPiece, 1200);
    if (!playing) togglePlay();
  }

  function newPiece() {
    seed = randomSeed();
    showSeed();
    restartPiece();
  }

  function chooseStyle(index) {
    if (index === style && audio.ctx) return;
    style = index;
    showStyle();
    restartPiece();
  }

  ui.play.addEventListener("click", togglePlay);
  ui.next.addEventListener("click", newPiece);
  ui.styles.forEach((button, index) => button.addEventListener("click", () => chooseStyle(index)));
  ui.volume.addEventListener("input", () => {
    try { localStorage.setItem("still-water-volume", ui.volume.value); } catch {}
    if (audio.gain) audio.gain.gain.setTargetAtTime(volumeGain(), audio.ctx.currentTime, 0.05);
  });
  document.addEventListener("keydown", (event) => {
    if (event.target instanceof HTMLInputElement || event.repeat || event.metaKey || event.ctrlKey) return;
    if (event.code === "Space") { event.preventDefault(); togglePlay(); }
    else if (event.key === "n" || event.key === "N") newPiece();
    else if (/^[1-6]$/.test(event.key)) chooseStyle(Number(event.key) - 1);
  });

  // The lake: slow wavy lines that swell with the music, and a ripple on each chord.
  const canvas = $("water");
  const draw = canvas.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const ripples = [];
  const samples = new Float32Array(1024);
  const drops = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), speed: 0.35 + Math.random() * 0.4 }));
  let lastFrame = 0;

  function ripple() {
    if (still.matches) return;
    ripples.push({ x: 0.35 + Math.random() * 0.6, y: 0.62 + Math.random() * 0.3, born: performance.now() });
  }

  function frame(now) {
    const ratio = devicePixelRatio || 1;
    const width = innerWidth, height = innerHeight;
    if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
    }
    draw.setTransform(ratio, 0, 0, ratio, 0, 0);
    draw.clearRect(0, 0, width, height);

    if (audio.analyser && playing) {
      audio.analyser.getFloatTimeDomainData(samples);
      let sum = 0;
      for (const s of samples) sum += s * s;
      level += (Math.sqrt(sum / samples.length) - level) * 0.03;
    } else {
      level *= 0.98;
    }

    const css = getComputedStyle(document.documentElement);
    const water = css.getPropertyValue("--water").trim();
    const glow = css.getPropertyValue("--glow").trim();
    const t = still.matches ? 0 : now / 1000;
    const horizon = height * 0.5;
    const lines = 16;
    draw.strokeStyle = water;
    for (let i = 0; i < lines; i++) {
      const depth = i / (lines - 1);
      const y = horizon + Math.pow(depth, 1.6) * (height - horizon) * 0.98;
      const amplitude = (1.5 + depth * 5) * (1 + level * 25);
      draw.globalAlpha = 0.15 + depth * 0.45;
      draw.lineWidth = 0.6 + depth * 0.9;
      draw.beginPath();
      for (let x = 0; x <= width; x += 8) {
        const wave = Math.sin(x * 0.006 / (0.4 + depth) + t * 0.25 + i * 1.7)
          + 0.5 * Math.sin(x * 0.017 / (0.4 + depth) - t * 0.4 + i);
        if (x === 0) draw.moveTo(x, y + wave * amplitude);
        else draw.lineTo(x, y + wave * amplitude);
      }
      draw.stroke();
    }

    const elapsed = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;
    if (STYLES[style].id === "midnight" && !still.matches) {
      draw.strokeStyle = water;
      draw.lineWidth = 1;
      draw.globalAlpha = 0.35;
      draw.beginPath();
      for (const drop of drops) {
        drop.y += drop.speed * elapsed;
        if (drop.y > 1) { drop.y -= 1.05; drop.x = Math.random(); }
        const x = drop.x * width - drop.y * 40, y = drop.y * height;
        draw.moveTo(x, y);
        draw.lineTo(x - 3, y + 14);
      }
      draw.stroke();
    }

    draw.strokeStyle = glow;
    for (let r = ripples.length - 1; r >= 0; r--) {
      const age = (now - ripples[r].born) / 1000;
      if (age > 9) { ripples.splice(r, 1); continue; }
      for (let ring = 0; ring < 3; ring++) {
        const radius = Math.max(0, age - ring * 0.9) * 46;
        if (radius <= 0) continue;
        draw.globalAlpha = Math.max(0, 0.5 * (1 - age / 9));
        draw.lineWidth = 1;
        draw.beginPath();
        draw.ellipse(ripples[r].x * width, ripples[r].y * height, radius, radius * 0.22, 0, 0, Math.PI * 2);
        draw.stroke();
      }
    }
    draw.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
